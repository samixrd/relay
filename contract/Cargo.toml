[package]
name = "relay-contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["RELAY Team"]
description = "RELAY — Stateful NFTs with associated NEAR accounts"
license = "MIT"

[features]
default = []
sandbox-checkout-dispatch = []

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"
bs58 = "0.5.1"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
ed25519-dalek = "2.2.0"
